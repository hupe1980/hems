[package]
name        = "hems-sim"
description = "Deterministic simulators for a home energy system — photovoltaics, battery, electric vehicle, heat pump and building, household load, a Steuerbox that speaks the EEBUS limitation use case, and a seeded weather realisation so the day that happens is not the day that was forecast — all on virtual time, so a whole day is a unit test"
keywords    = ["energy", "simulation", "hems", "testing"]
categories  = ["simulation", "development-tools::testing"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

# **Not `hems-forecast`, and not by accident.** This crate is the day that
# *happens*; the forecaster is the day that was *expected*, and keeping them
# apart is the whole of D35 — a simulator that can read the forecast is one that
# can be shown the answer. `cargo xtask check-deps-used` keeps the edge out.
#
# **And not `hems-grid` either, since D186.** The simulated Steuerbox used to
# emit the rule crate's own `LpcEvent`, which tied a simulator of the *operator's*
# box to one particular household-side state machine. It emits its own `Command`
# now, and `hemsd` translates — so this crate simulates the other side of a wire
# rather than half of the thing on this side of it.
[dependencies]
hems-core     = { workspace = true }
serde         = { workspace = true, optional = true }
time          = { workspace = true }

[features]
default = ["serde"]
## Serialize/deserialize every public type.
serde = ["dep:serde", "hems-core/serde"]
