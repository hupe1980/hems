[package]
name        = "hems-service"
description = "The shell every hems daemon shares — configuration from a file and the environment, structured logging, a health and readiness surface, and a shutdown that finishes what it started"
keywords    = ["energy", "daemon", "hems", "service"]
categories  = ["network-programming"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
rust-version.workspace = true

[features]
# The fleet daemons' PostgreSQL pool. Off by default because `hemsd` links this
# crate for its configuration and health surface and keeps its own two years in
# `redb` on the box — a gateway image has no business carrying a Postgres driver.
postgres = [
    "dep:tokio-postgres", "dep:tokio-postgres-rustls", "dep:deadpool-postgres",
    "dep:rustls", "dep:webpki-roots",
]
# A real PostgreSQL in a container, for a daemon's own tests. Implies `postgres`
# because a fixture that could not open a pool would be a fixture for nothing.
testkit  = ["postgres"]

[dependencies]
tokio-postgres         = { workspace = true, optional = true }
tokio-postgres-rustls  = { workspace = true, optional = true }
deadpool-postgres      = { workspace = true, optional = true }
rustls                 = { workspace = true, optional = true }
webpki-roots           = { workspace = true, optional = true }

# **The one place an outbound client is built** (`http`). Every daemon that
# reaches out goes through it, so the trust anchors and the "no plaintext across
# a network" rule are decided once rather than at seven call sites.
reqwest            = { workspace = true }
url                = "2"
ed25519-dalek      = { workspace = true }
hex                = { workspace = true }
http               = { workspace = true }
sha2               = { workspace = true }
axum               = { workspace = true }
# Prometheus, on the port the daemon already binds. `default-features = false`
# drops its own HTTP push gateway and protobuf encoder: what is served here is
# the text exposition format on a route this crate already owns.
prometheus         = { version = "0.14", default-features = false }
# The Model Context Protocol surface every fleet daemon mounts at `/mcp`.
# Server side only: a daemon that could *call* a model is a daemon whose answers
# depend on one, and none of these answers may.
rmcp               = { workspace = true }
tokio-util         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thiserror          = { workspace = true }
time               = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }

# `tests/migrations.rs` needs a real PostgreSQL, which is `testdb` behind the
# `testkit` feature. An integration test links this crate from outside, so
# `cfg(test)` does not reach the library and the feature has to be on — but a
# **dev-dependency on itself** is the wrong way to say so. Cargo resolves a
# versioned dev-dependency against the registry at publish time, so a
# self-dependency asks crates.io for the version being published and
# `cargo publish` fails: *"failed to select a version for the requirement
# `hems-service = ^0.2`"*. It survives a patch release only because the previous
# version is already on the index, which makes it a release blocker that hides
# until the next minor bump.
#
# `required-features` is the mechanism the problem actually wants: it states what
# the test needs, and a build without it **skips** the test instead of failing to
# compile. `just test` runs `--all-features`, so the suite is unaffected.
[[test]]
name             = "migrations"
required-features = ["testkit"]
