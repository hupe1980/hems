[package]
name        = "hems-events"
description = "Every CloudEvents type the hems workspace emits, the envelope they travel in, and the Standard Webhooks signature that says a box sent one — a compile-time catalogue checked by a workspace guard, so an event nobody consumes and a consumer of an event nobody emits are both build failures"
keywords    = ["energy", "cloudevents", "hems", "events"]
categories  = ["science"]
readme      = "README.md"
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
base64     = { workspace = true }
hmac       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }
time       = { workspace = true }
