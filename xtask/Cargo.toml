[package]
name    = "xtask"
# Inherits the workspace version like everything else, so one checkout is one
# version. No `homepage`: it is `publish = false` and has no page to point at.
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow      = { workspace = true }
hems-events = { workspace = true }
