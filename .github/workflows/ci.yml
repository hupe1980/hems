name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  purity:
    name: Domain crates stay pure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      # The guard, the arbiter and the planner take time as a parameter. The
      # moment one of them reads a clock, a whole winter day stops being a unit
      # test — so this is a build failure, not a review comment.
      - run: just purity

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  features:
    name: Feature permutations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - --no-default-features
          - --all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `serde` is optional across the domain crates and it is easy to leave a
      # `#[cfg_attr]` behind that only compiles one way round.
      - run: cargo check --workspace ${{ matrix.args }}

  solvers:
    name: Solver backends
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [microlp, highs]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # HiGHS needs cmake and a C++ toolchain; microlp needs neither, which is
      # why it is the default and why both have to keep working.
      - run: cargo test -p hems-optimizer --no-default-features --features ${{ matrix.backend }},serde

  guards:
    name: Workspace guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every regulatory citation resolves to an indexed document, every
      # CloudEvents type is in the catalogue, and every crate can actually be
      # packaged. All three failures are otherwise silent — the last one until
      # the day somebody runs `cargo publish`.
      - run: cargo xtask check-all

  demo:
    name: Simulated days
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # An example nobody runs rots. These are the product demonstration — and
      # the only check that has ever caught a rule module nobody calls.
      - run: cargo run -p hemsd -- simulate --day winter
      - run: cargo run -p hemsd -- simulate --day summer --json
      - run: cargo run -p hemsd -- simulate --day deadline
      - run: cargo run -p hemsd -- simulate --day shared
      - run: cargo run -p hemsd -- simulate --day offline
      - run: cargo run -p hemsd -- simulate --day autumn
      - run: cargo run -p hemsd -- simulate --day capped
      - run: cargo run -p hemsd -- simulate --day capped --imsys
      # § 42c: the day the community term has a caller. A rule module nobody
      # invokes is not a feature, and no property test catches one.
      - run: cargo run -p hemsd -- simulate --day winter --sharing

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  msrv:
    name: Minimum supported Rust version (1.94)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
