name: Release

# Cutting a release is `git tag v0.2.0 && git push --tags`. Everything below
# follows from that, in an order chosen so the irreversible step happens last:
# crates.io cannot be un-published, a GitHub release can be deleted, and a failed
# build costs nothing.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # A manual run builds, packages and smoke-tests everything and publishes
  # nothing: the two publishing jobs are gated on the trigger being a tag. That
  # is the dry run, and it needs no flag anybody could forget to set.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Never cancel: a half-finished publish is worse than a queued one.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ── 1. The tag says what it is, and the tree passes the same gate main does ──
  #
  # A tag can be pushed at any commit, including one that never went through the
  # pull-request lane. Re-running the whole gate here costs a few minutes and is
  # the only thing standing between "somebody tagged the wrong SHA" and a
  # published crate.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the workspace version
        id: version
        run: |
          set -euo pipefail
          manifest="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)"
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$manifest" ]; then
              echo "::error::tag v$tag does not match [workspace.package] version $manifest"
              exit 1
            fi
          fi
          echo "releasing $manifest"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # fmt · clippy · purity · tests · workspace guards · licences · docs.
      - run: just ci

  # ── 2. The daemon, for the boxes it runs on ─────────────────────────────────
  #
  # Linux only, and on purpose: `hemsd` is an edge daemon for a gateway box, not
  # a desktop application. Both architectures are built **natively** rather than
  # cross-compiled, because the planner links HiGHS — a C++ library built from
  # source by cmake — and a native runner is simpler and more honest than a
  # cross-toolchain that has to be trusted to produce the same numbers.
  #
  # There is deliberately no musl target yet: HiGHS on musl is an open question
  # (static C++ runtime, binary size), and shipping a build nobody has run on a
  # real box would be a claim rather than an artefact.
  binaries:
    name: hemsd (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake

      # `cargo-auditable` embeds the exact dependency tree in the binary, so the
      # SBOM can be recovered from an artefact found in the field rather than
      # trusted from a file shipped beside it. That is what a CRA vulnerability
      # process needs when somebody asks "which boxes have this crate on them?"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable

      - run: cargo auditable build --release --locked -p hemsd

      # The binary is exercised before it is shipped. A release that has never
      # run a day through its own control stack is a file, not a build.
      - name: Smoke test
        run: |
          ./target/release/hemsd simulate --day winter
          ./target/release/hemsd simulate --day shared --json > /dev/null

      - name: Package
        run: |
          set -euo pipefail
          name="hemsd-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/hemsd "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: hemsd-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # ── 3. What is in it ────────────────────────────────────────────────────────
  #
  # A CycloneDX bill of materials for the daemon. The CRA asks for one and so does
  # every customer with a procurement department; producing it in the same run
  # that produces the binaries is what keeps the two describing the same thing.
  sbom:
    name: SBOM
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-cyclonedx
      # `cargo-cyclonedx` takes **no `-p`**. It walks the workspace and writes one
      # SBOM per member beside that member's manifest, and `--manifest-path` picks
      # which manifest it starts from rather than which crate it emits. So the
      # daemon's file is named directly below: `hemsd` is the artefact that ships
      # and its tree transitively contains every domain crate, which is why one
      # file is the bill of materials and twenty are a directory listing.
      - run: cargo cyclonedx --manifest-path services/hemsd/Cargo.toml --format json --all-features
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Named, not found. A `find` over `*.cdx.json` matches all twenty and
          # copying each onto one destination leaves whichever the filesystem
          # happened to return last — an SBOM for an arbitrary crate, under the
          # daemon's name.
          cp services/hemsd/hemsd.cdx.json \
             "sbom/hemsd-${{ needs.verify.outputs.version }}.cdx.json"
          # It has to describe the daemon and contain the whole workspace, or it
          # is a bill of materials for something else.
          python3 - "sbom/hemsd-${{ needs.verify.outputs.version }}.cdx.json" <<'PY'
          import json, sys
          bom = json.load(open(sys.argv[1]))
          name = bom["metadata"]["component"]["name"]
          ours = sum(1 for c in bom["components"] if c["name"].startswith("hems-"))
          assert name == "hemsd", f"the SBOM describes {name}, not hemsd"
          assert ours >= 12, f"only {ours} hems crates in it — not the daemon's whole tree"
          print(f"{name}: {len(bom['components'])} components, {ours} of them ours")
          PY
          ls -l sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/*.json
          if-no-files-found: error

  # ── 4. The GitHub release ───────────────────────────────────────────────────
  release:
    name: GitHub release
    needs: [verify, binaries, sbom]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement, in a public transparency log, that
      # these artefacts came out of this workflow at this commit. It is what lets
      # somebody who downloaded a tarball check that it is the one we built.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum ./*.tar.gz ./*.json > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*.tar.gz

      - uses: softprops/action-gh-release@v2
        with:
          name: hems ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.json
            artifacts/SHA256SUMS

  # ── 5. crates.io, last, because it cannot be undone ─────────────────────────
  #
  # Twelve publishable crates. The daemons and `xtask` are `publish = false` and
  # are not in the list below.
  #
  # Authentication is **trusted publishing**: GitHub's OIDC identity is exchanged
  # for a token that lives thirty minutes. There is no long-lived
  # `CARGO_REGISTRY_TOKEN` in the repository secrets to leak, and the exchange
  # only succeeds for this workflow on this repository.
  #
  # It is configured **per crate**, and that is the operational catch: each of
  # the twelve needs its own entry at `crates.io/crates/<name>/settings` naming
  # owner `hupe1980`, repository `hems`, workflow `release.yml` and environment
  # `crates-io`. A crate without one fails at its own step with a permissions
  # error, and everything before it has already published — which the loop below
  # is built for: add the missing entry and re-run the tag.
  #
  # No crate here needs a manual first publish. That rule applies to a crate
  # *name* that has never been published, and all twelve have been since 0.1.0.
  crates-io:
    name: Publish to crates.io
    needs: [verify, binaries]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Named so crates.io's trusted publishing can be scoped to it, and so a
    # required reviewer can be added later without touching this file.
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # One `cargo publish` per crate, in dependency order, **tolerating a crate
      # that is already there** — `mako`'s shape, for `mako`'s reason.
      #
      # `cargo publish --workspace` is neither atomic nor resumable: an upload
      # that fails partway leaves the crates that landed on crates.io, cargo has
      # no `--skip-published`, and a second run dies on the first one it finds
      # (rust-lang/cargo#16181). A version cannot be un-published, so that is a
      # release with no way forward but finishing it by hand.
      #
      # Tolerating "already uploaded" makes the whole job idempotent: re-run the
      # tag and it publishes exactly what did not land. It is also what makes the
      # hand-written order below safe to get wrong — a crate whose dependency is
      # not on the registry yet fails loudly, and the re-run after fixing the
      # order skips everything that already went.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -uo pipefail
          for crate in hems-core hems-events hems-service hems-device \
                       hems-forecast hems-grid hems-sim hems-drv hems-flex \
                       hems-realtime hems-tariff hems-optimizer; do
            echo "::group::$crate"
            out=$(cargo publish -p "$crate" --locked 2>&1) && rc=0 || rc=$?
            echo "$out"
            echo "::endgroup::"
            if [ $rc -ne 0 ] \
               && ! echo "$out" | grep -qE "already uploaded|already exists on crates\.io"; then
              exit $rc
            fi
          done
