[package]
name        = "hemsd"
description = "The hems edge daemon — the guard, arbiter and planner of one household, with a simulated site to run them against"
publish     = false
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[[bin]]
name = "hemsd"
path = "src/main.rs"

[lib]
name = "hemsd"
path = "src/lib.rs"

[dependencies]
hems-core      = { workspace = true }
# Both protocols: this is the process that owns the sockets, so it is the one
# place the transports are allowed to exist.
hems-drv       = { workspace = true, features = ["eebus", "modbus"] }
hems-events    = { workspace = true }
hems-flex      = { workspace = true }
hems-forecast  = { workspace = true }
hems-grid      = { workspace = true }
# The daemon is built with HiGHS: a gateway box solves a 96-slot horizon every
# quarter of an hour, and the pure-Rust fallback is for library consumers who
# would rather not have a C++ toolchain than for the thing doing the solving.
hems-optimizer = { workspace = true, features = ["highs"] }
hems-realtime  = { workspace = true }
hems-service   = { workspace = true }

# The SHIP session under the EEBUS Controllable System: TCP, TLS 1.2 with mutual
# authentication, the WebSocket upgrade and the handshake. This is the process
# that owns the sockets, so it is the one place the transport is allowed to
# exist — `hems-drv` stays sans-I/O and the purity gate keeps it that way.
#
# `aws-lc-rs` rather than `ring`, and named rather than inherited: `rustls` 0.23
# supports both and picking one is the consumer's decision because it is
# process-global — two providers in one binary panic at the first connection.
# The rest of the workspace already runs `aws-lc-rs` through `reqwest` (D84), so
# this is the same choice stated twice rather than a second one.
eebus        = { workspace = true, features = ["runtime", "aws-lc-rs"] }
hems-sim       = { workspace = true }
hems-tariff    = { workspace = true }
metering       = { workspace = true }

anyhow       = { workspace = true }
axum         = { workspace = true }
clap         = { version = "4", features = ["derive", "env"] }
# The box's one outbound call, on the **async** client. `main` is
# `#[tokio::main]`, so every command runs inside a runtime, and
# `reqwest::blocking` builds a runtime of its own that panics when dropped in an
# asynchronous context (D115). Taken from the workspace so the box and the fleet
# share one HTTP client and one TLS provider (D84, D85).
reqwest      = { workspace = true }
rusqlite     = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
toml         = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
time         = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
