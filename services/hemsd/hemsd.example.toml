# hemsd — the configuration of one household.
#
#   hemsd run --config /etc/hems/hemsd.toml
#
# Every value in [service], [control] and [site] below is the default, so a file
# that sets none of them describes the reference household. The `[[drivers]]`
# list has no default and `hemsd run` refuses to start without it: a box with no
# drivers measures nothing, so the guard would assume every controllable device
# was drawing its nameplate power, for ever.
#
# The environment overrides the file (`HEMS_HEMSD_…`), because the file is what
# somebody wrote down last month and the environment is what an operator reaches
# for when something is on fire.
#
# This file is parsed by a test in `config.rs`, so an example that has drifted
# from the struct it documents fails the build rather than misleading an
# installer.

# The box's own two years, and what it has learned about its own house.
#
# [A1 7.3] documents a control event for two years and G3 says the house is
# never worse off when the cloud is gone, so a record that exists only once it
# has been uploaded is an intention with a network dependency. It is also where
# the correction this roof has earned and this household's own quarter hours are
# kept, and without it every reboot costs a fortnight of both.
store_path = "/var/lib/hemsd/hemsd.sqlite"

# ── The shell ────────────────────────────────────────────────────────────────
[service]
# Loopback, not 0.0.0.0. A daemon on a household gateway box is on the
# household's own network, and a box that binds every interface by default is a
# box that is exposed by default. Put a proxy in front of it to change that.
listen = "127.0.0.1:8080"
log_filter = "info"
log_json = false
shutdown_grace_s = 20

# ── How fast the planes run ──────────────────────────────────────────────────
[control]
# The guard and the arbiter. The guard needs this as arithmetic and not only as
# a schedule: a bound on a *state* — a backup reserve, a full battery — is only
# a bound on a *rate* once you know how long the rate will be held for.
#
# It also decides how much of the household's own consumption the guard is
# willing to lend the roof as § 9 EEG feed-in headroom. A loan is outstanding
# until the guard next runs, so a heat pump answering its own thermostat puts
# the connection point over a statutory ceiling for one of these. At a second
# the whole draw is lendable; raising this number curtails the roof instead.
tick_period_s = 1
# The planner, on a receding horizon.
replan_every_s = 300
# Two days of quarter hours. One is not enough: a re-plan at six in the evening
# on a one-day horizon is told there is no sun *and* no household tomorrow.
horizon_slots = 192
# What the solver may spend, seconds. 0 means "no limit", which is what a
# household wants if it needs the same inputs to give the same plan every time.
solve_budget_s = 10.0

# How the planner treats the fact that its forecasts are wrong.
#
#   median       one future, the median of both forecasts. The default, and what
#                every figure in this project is measured against.
#   expected     three futures from the band the forecast already carries,
#                minimising the expected cost across them.
#   hedged       the same three, with a third of the objective on the worst.
#   pessimistic  one pessimistic quantile of each — the cheap robustness knob,
#                and the inferior construction: it is optimal against a world
#                nobody expects, and the household pays the hedge every ordinary
#                day with no credit on the bad one.
#
# Measured over twenty seeded weathers on each of two days: three futures beat
# the median on the *mean* where a service is at risk (€2,96 against €2,81) and
# take the undelivered charge from €0,07 to €0,01 — and cost €1,04 a day where
# nothing is at risk, while improving no worst day at all. They also cost about
# seven times the solve. Which is why the default is one median and why this is
# a household's decision rather than an inherited one.
risk = "median"

# What this household will pay to avoid something other than money.
#
# Both default to zero, which is the plain economic plan — and both are terms the
# planner's objective has always read while *nothing could set them*, so a
# household that had bought a battery for independence had no way to say so.
#
# They are prices rather than a "mode", and that is deliberate: an enum of goals
# (cost / carbon / self-sufficiency) swaps the energy price for grams and leaves
# battery wear, comfort and curtailment in euros, so the plan ends up minimising
# a sum of two currencies. As prices they are comparable with every other term
# and they add up.
[control.preferences]
# 55 €/t — the German price for heating and transport fuels — is 0.055. It only
# does something different from the dial below where the tariff carries a
# per-slot carbon intensity, which `tariffd` serves from Energy-Charts: with a
# flat intensity a carbon price *is* an autarky premium, because every hour is
# equally dirty.
co2_eur_per_kg = 0.0
# The self-sufficiency dial, honest about its price: near the day's spread it
# makes the plan prefer its own roof even where importing would be marginally
# cheaper, and the difference is what independence cost.
autarky_eur_per_kwh = 0.0

# ── The house ────────────────────────────────────────────────────────────────
#
# Every field carries its unit in its name. A configuration file is read by a
# person with a clipboard standing in a cellar.
#
# **A size of zero means the household has no such device, and the site says
# so**: `pv_kwp = 0` builds no roof, `battery_kwh = 0` no battery,
# `evse_max_a = 0` no charge point, `heat_pump_kw = 0` no heat pump,
# `dhw_litres = 0` no tank. An absent asset is never decided for, never appears
# in the S2 description, and a driver configured for one is refused at start-up
# — which is the mismatch `run --check` exists to catch.
[site]
pv_kwp = 9.8
pv_ac_kw = 8.0
battery_kwh = 10.0
battery_kw = 5.0
# Held back for a power cut. The planner never plans below it and the guard
# bounds the discharge power so a whole control period cannot cross it.
reserve_soc = 0.1
# What a kilowatt-hour of throughput costs in battery life. Leave it at zero and
# the plan will cycle the pack for a spread that does not cover the damage.
battery_wear_eur_per_kwh = 0.08
fuse_a = 35.0

# The federal state whose public holidays decide a day type — a holiday counts
# as a Sunday in a load profile, and Fronleichnam is a working day in Berlin and
# is not in Bayern.
bundesland = "BE"

latitude = 52.52
longitude = 13.4
altitude_m = 34.0

heat_pump_kw = 5.0
heat_pump_modulating = true
# How the unit takes instructions: "power-ceiling" (EEBUS LPC or a vendor
# register), "sg-ready" (two relay contacts), "operation-modes", or "compressor"
# (EEBUS OHPCF). The first three are all bounds — they can only ask the unit to
# do less, so a plan that wants it to pre-heat into a cheap hour cannot say so.
# "compressor" is the one that starts a process, and it needs an
# `eebus-heat-pump` driver below.
heat_pump_control = "power-ceiling"
# How far the house may drift. This is the trade the whole heating plan turns
# on: widen it and the box can carry the house through an expensive evening on
# what it banked at noon; narrow it and the heating is its own thermostat's
# business again. The planner only moves the building at all where a driver
# reports an indoor temperature — a plan built on a guessed one decides when to
# heat from a number nobody read.
comfort_min_c = 20.0
comfort_max_c = 23.0

dhw_litres = 300.0
dhw_heater_kw = 0.5

# The charge point's largest current per conductor. 16 A three-phase is the
# ordinary "11 kW" wallbox, 32 A the "22 kW" one; zero says the household has
# no charge point at all.
evse_max_a = 16.0
# Almost every wallbox sold in Germany since about 2022 can drop to one
# conductor, and it decides whether 2 kW of surplus charges a car or is
# exported: three-phase charging cannot start below 4,14 kW.
evse_switchable = true
ev_charge_limit = 0.75

# § 9 Abs. 2 EEG lifts the 60 % feed-in cap only after the network operator's
# **first successful Ansteuerbarkeit test** — a different event on a different
# clock from the meter being fitted. So this stays false until that test has
# happened, however long the meter has been in the cupboard.
imsys_control_device = false
# When the intelligent metering system was fitted, which is § 51 EEG's clock:
# from the end of that calendar year the plant earns nothing in a negative
# quarter hour. Remove the line for a household that has no such meter.
imsys_since = "2024-06-01"

# The dishwasher's programme, as the average power in kW of each consecutive
# quarter hour: heat, wash, wash, wash, dry, finish. Steps rather than a
# duration and an average, because a planner given the average would schedule
# 700 W into every sunny slot and no dishwasher will do that. Leave the list
# empty for a household with nothing waiting.
dishwasher_kw_steps = [2.0, 0.2, 0.2, 0.2, 1.8, 0.1]

# ── What a kilowatt-hour costs and earns ─────────────────────────────────────
#
# Everything is **net** ct/kWh, because that is how a German price sheet is
# written; the levies and the value-added tax are added on top from
# `hems_tariff::Levies`.
[tariff]
# § 41a EnWG has obliged every supplier to offer a dynamic tariff since
# 01.01.2025, and since 01.10.2025 the market time unit has been a quarter hour
# — which is why this whole workspace plans in quarter hours.
markup_ct_per_kwh = 3.0
# What to assume past tomorrow's auction, and after an outage. A *flat* number,
# which makes the plan indifferent about when to act out there — exactly the
# state of knowledge.
fallback_ct_per_kwh = 20.0
# Set `fixed_ct_per_kwh` instead and the box stops asking `tariffd` for
# anything: a household on a fixed tariff has no day-ahead curve to optimise
# against, and shifting load for a spread it is not charged is not a saving. It
# still plans against the roof, the battery and the § 14a ceiling.
# fixed_ct_per_kwh = 28.5

network_ct_per_kwh = 10.0
# "none", "modul1", "modul2" or "modul3".
modul = "modul1"
modul_1_reduction_eur_per_year = 120.0

# ── Modul 3, where the household is on it ────────────────────────────────────
#
# Time-variable network charges, and the one flexibility a household knows about
# a **year in advance**. There is no machine-readable national format — a PDF or
# an Excel sheet per network operator — so whoever commissions the box
# transcribes the operator's calendar here, and `hemsd run --check` refuses to
# start on one that breaks the BDEW Anwendungshilfe.
#
# Uncomment together with `modul = "modul3"`. Both halves or neither.
#
# [tariff.modul3]
# id = "NB-14A-3-2026"
# year = 2026
# # Minutes of the local day. At least two hours of Hochtarif on every day class
# # the definition distinguishes; the Niedertarif band may wrap past midnight.
# hochtarif_minutes  = [1020, 1200]   # 17:00–20:00
# niedertarif_minutes = [1320, 360]   # 22:00–06:00
# # The operator's Wahlrecht, published on the price sheet. At least two.
# billed_quarters = ["Q1", "Q4"]
# # The operator's own three working prices, ct/kWh.
# ht_ct_per_kwh = 18.0
# st_ct_per_kwh = 10.0
# nt_ct_per_kwh = 4.0
# # Required. When a household queries a bill, the first question is which
# # document said so.
# source = "https://www.example-netz.de/preisblatt-2026.pdf#modul3"

feed_in_ct_per_kwh = 7.86
standing_charge_eur_per_year = 120.0

# ── Where the box asks for prices and weather ────────────────────────────────
#
# Both optional, and a box with neither still runs: the guard and the arbiter
# need nothing but measurements. What it loses is the plan — and it says so, on
# `/v1/status` and on the readiness probe, rather than looking like a box that
# is planning badly.
[fleet]
tariffd_url = "http://tariffd.internal:7380"
forecastd_url = "http://forecastd.internal:7280"
# Which of `forecastd`'s **configured** locations is this household's. A name
# rather than a latitude: the sun position a production figure is computed from
# has to be the one the irradiance was fetched at, so a box that could name its
# own coordinates would be given somebody else's sky.
location = "berlin"
request_timeout_s = 10

# ── Where the box forwards its own record ────────────────────────────────────
#
# The box records **first** and forwards second: [A1 7.3] gives a network
# operator two years to ask about a control event, and the day they ask about is
# the day the link was down. What has not been acknowledged stays in the store's
# outbox, and forwarded is never deleted — the two years are the household's.
[histd]
url = "http://histd.internal:7580"
site = "reference-household"
# The *reference*, never the credential: one in a configuration file is one in
# an image, in a backup and eventually in a repository.
token = "env:HEMS_HISTD_TOKEN"
# Slow on purpose. What is being forwarded is already safe on the box, so
# urgency buys nothing but load on a service the household does not own.
every_s = 300
# A box that has been offline for a month has a month of backlog, and sending it
# in one burst is how a fleet service falls over the morning a region comes back.
batch = 50

# ── How the day went ─────────────────────────────────────────────────────────
#
# One signed CloudEvent per day to `obsd`. It goes through the same store as the
# evidence and for the same reason: what is written down survives the send
# failing, and what is only in flight does not. A fleet that is down therefore
# costs a delay rather than a day, and the drain above carries both.
#
# The signature is made at each attempt rather than stored — Standard Webhooks
# covers the timestamp and `obsd` refuses one older than five minutes, so a box
# back from an overnight outage would otherwise present a backlog of stale ones.
[obsd]
url = "https://obsd.internal:7780"
# A **signature** secret, not a bearer token. What `obsd` holds is the list of
# households that did not respect a network operator's reduction, so an
# unauthenticated write can put a compliant site on it. A token says who is
# asking; a signature says what was said.
secret = "env:HEMS_OBSD_SECRET"

# ── How the box presents itself on the EEBUS network ─────────────────────────
#
# Its SKI is printed by `hemsd run --check` and served on /v1/status. That is
# the number the metering point operator needs before a Steuerbox will trust
# this box, and it follows the key — which lives in `store_path` above, so it is
# the same number after a reboot and the pairing is done once.
#
# The Energy Guard is the network operator's box and it is the side that dials,
# so the household **listens**. Without `listen` the § 14a driver runs its clock
# and hears nothing, which `hemsd run` reports as an error rather than leaving
# a household to believe it is participating.
[ship]
listen = "0.0.0.0:4712"
# The certificate's common name — `<IANA PEN>_<vendor product id>` where there is
# one. It is not the identity: that is the **SKI**, which follows the key, is
# kept in the box's own store so it survives a reboot, and is printed at start-up
# because it is what the metering point operator has to be given. Field reports
# make that exchange the most common § 14a commissioning failure there is.
ship_id = "hems_hems-1"
# The Steuerbox's own SKI, as printed on it. A peer that is not here may still
# complete TLS — it has to, so its SKI can be shown to a user — and is held short
# of the data phase. Merged with whatever the store already trusts, so a pairing
# done through a screen is not undone by a deployment that did not know about it.
trust = []
# Announce this box on the local network as `_ship._tcp` (SHIP § 6), so an Energy
# Guard can find it rather than being given an address by hand. The record
# carries the SHIP ID, the WebSocket path and the SKI, which is also what a
# certification lab asks to see. The announcement is withdrawn for the length of
# a session, because a Controllable System has exactly one Energy Guard and a
# second one that found this box would be refused. Turn it off on a segmented
# network, or where something else announces on this box's behalf.
announce = true

# ── What speaks to the hardware ──────────────────────────────────────────────
#
# One entry per device, and `asset` has to name an asset the site above has.
#
# An asset may have **two** drivers: one that commands it and one that measures
# it — a wallbox driven over Modbus and read over EEBUS EVCC/EVSOC, a heat pump
# started over OHPCF and read through its register map. What is refused is two of
# either, along with a driver for an asset that does not exist and a controllable
# asset no driver can command: all at start-up, rather than months later by a
# limit that never arrived.

# The inverter, over SunSpec on Modbus TCP.
[[drivers]]
kind = "sunspec"
asset = "pv"
address = "192.0.2.10:502"
unit = 1
poll_ms = 1000
# Shorter than the guard's own `max_measurement_age`, or a device could be
# silent for a whole control period while the guard still called its last
# reading fresh.
timeout_ms = 5000
listens_only = false
# SunSpec model 123 expresses a production ceiling as a percentage of the
# rating, so a curtailment cannot be expressed at all without one.
rating_kw = 8.0

# The meter at the connection point. Read and never written — and the one
# measurement every § 14a decision starts from: `[A1 2.3]` measures the
# netzwirksamer Leistungsbezug *there*, and without it the guard has to close
# its balance from the sub-meters alone, which understates the rest of the house
# by exactly the loads nobody instrumented.
[[drivers]]
kind = "sunspec"
asset = "netzanschluss-zaehler"
address = "192.0.2.11:502"
unit = 1
listens_only = true

# The network operator's Steuerbox, over EEBUS. The session it arrives on is
# `[ship]` above.
# The hot-water tank, over EEBUS MDT — the other direction entirely. § 14a is a
# network operator dialling *this* box; a hot-water circuit is a device on the
# household's own network that this box dials. Uncomment it where the tank has
# one: the planner has modelled a hot-water store since the optimiser was
# written and has never been given one on a running box, for want of a single
# number — how warm the water is now. Without it the tank is left out of the
# plan entirely rather than guessed at, because a store whose state of charge is
# assumed is one the plan will decide not to heat on exactly the mornings it
# matters.
#
# `ski` is required and is the whole of the trust decision: TLS proves a peer's
# SKI, and a box that dialled whatever answered would take a tank temperature
# from anything on the network that offered one.
#
# The car, over EEBUS EVCC and EVSOC — whether one is plugged in and how full it
# is. This is the fact the plan was always missing about a charge point: the
# arbiter has commanded amperes since the first day, and nothing reported an
# arrival, so `EvSession` was in the optimiser and never built on a running box.
#
# `departure` and `target_soc` are the household's, not the car's: no EEBUS use
# case carries either, and a car that published a departure time would be
# publishing a guess about its driver. `target_soc` is below 1,0 on purpose —
# the last fifteen per cent of a charge is the slowest and least useful part of
# a session, and asking for a full battery every night is paid for on every one.
#
# It reads and never commands. The charge point is already commanded, over
# Modbus or through the § 14a envelope, and two drivers commanding one wallbox
# is one wallbox nobody can predict.
#
# [[drivers]]
# kind = "eebus-ev"
# asset = "wallbox"
# address = "192.168.1.50:4712"
# ski = "0000000000000000000000000000000000000000"
# departure = "07:00"
# target_soc = 0.8

# The hot-water circuit, over EEBUS. It reads the tank's temperature (MDT) and
# asks for a one-time loading (CDSF) — the button in the bathroom, pressed over
# the wire, which is the shortest path there is from "the roof is exporting" to
# "the tank is absorbing it". One driver, because SHIP grants one session per
# peer pair.
#
# [[drivers]]
# kind = "eebus-dhw"
# asset = "warmwasser"
# address = "192.168.1.40:4712"
# ski = "0000000000000000000000000000000000000000"

# A device read through the vendor's own register map.
#
# Everything that answers Modbus and publishes no SunSpec model list: the
# register numbers are in a PDF and every unit's are different. It reads and
# never writes — a map that could write is one where a typo in this file starts a
# compressor — so it pairs with whatever commands the device, and is refused
# alone on a controllable asset.
#
# For a heat pump it is the **alternative** to `eebus-heat-pump` above rather
# than a companion: both measure, and two measuring drivers for one asset is two
# sources of truth with nothing that could tell which to believe.
#
# `space` is "holding" (the default) or "input"; most vendors put sensors in the
# input space that SunSpec never touches, and the two are separately addressed,
# so reading the wrong one returns a plausible number from somewhere else.
# `word` is u16 (default), s16, u32, s32, u32_swapped or s32_swapped — the
# swapped pair are the word orders many gateways use, and getting it wrong is the
# most common way a map reads plausibly and is several orders of magnitude out.
# `scale` multiplies the raw value into the field's own unit, and a negative one
# is how a vendor that reports generation as positive becomes this workspace's
# load convention. `field` is power, temperature_c or soc.
#
# The **indoor temperature** is why this driver exists: the planner models the
# building, learns it from the household's own record and can pre-heat into a
# cheap hour, and all of it is gated on a number no EEBUS use case carries.
#
# [[drivers]]
# kind = "registers"
# asset = "waermepumpe"
# address = "192.0.2.30:502"
# unit = 1
# poll_ms = 1000
# timeout_ms = 5000
# points = [
#   { space = "input", register = 507, word = "s16", scale = 0.1, field = "temperature_c" },
#   { register = 2240, word = "u32", field = "power" },
# ]

# The heat pump, over EEBUS. Three use cases on one session, because they are
# three parts of one decision:
#
#   OHPCF — starts and stops the compressor's process. The only lever in the
#           whole set that can ask an appliance to consume *more*: everything
#           else on the grid side is a ceiling, and a ceiling an appliance is
#           already under changes nothing. Set `heat_pump_control = "compressor"`
#           under [site] to have the planner's decision reach it.
#   MRT   — the air temperature of each room the unit monitors, averaged. This is
#           the state the thermal plan is integrated from, and the unit has been
#           measuring it all along: its own heating curve runs on it.
#   MOT   — the outdoor temperature, from the sensor on this building rather than
#           a forecast for the grid square. The plan still uses the forecast, but
#           the box identifies *which house this is* from the thermometer.
#
# It does not report power: what the unit draws is the site meter's business.
#
# [[drivers]]
# kind = "eebus-heat-pump"
# asset = "waermepumpe"
# address = "192.168.1.60:4712"
# ski = "0000000000000000000000000000000000000000"

[[drivers]]
kind = "eebus-lpc"
asset = "netzanschluss"
# Omit `failsafe_kw` and the box computes `[A1 4.5.2]`'s own minimum from the
# site, which grows with the number of controllable devices. A vendor's flat
# 4,2 kW on a household owed 10,5 kW gives away six kilowatts nobody asked for.
failsafe_hours = 2
spine_vendor = "n:hems"
spine_unique = "hems-1"
