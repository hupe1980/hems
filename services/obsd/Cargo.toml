[package]
name        = "obsd"
description = "The fleet's observability service: what every household's day came to, what it saved, and — counted rather than averaged — which of them did not respect a network operator's instruction"
publish     = false
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
hems-core     = { workspace = true, features = ["serde"] }
hems-events   = { workspace = true }
hems-forecast = { workspace = true }
hems-service  = { workspace = true }

anyhow     = { workspace = true }
axum       = { workspace = true }
clap       = { version = "4", features = ["derive", "env"] }
serde      = { workspace = true }
serde_json = { workspace = true }
time       = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
tracing    = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
