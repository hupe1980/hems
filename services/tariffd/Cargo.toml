[package]
name        = "tariffd"
description = "The fleet's price service: fetches the five published day-ahead sources, reconciles a curve that arrives twice, and keeps two days of it so a WAN outage never costs a household a plan"
publish     = false
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
hems-core    = { workspace = true }
hems-service = { workspace = true }
hems-tariff  = { workspace = true, features = ["serde"] }

anyhow       = { workspace = true }
axum         = { workspace = true }
clap         = { version = "4", features = ["derive", "env"] }
reqwest      = { workspace = true }
rust_decimal = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
time         = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync"] }
tracing      = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
