[package]
name        = "agentd"
description = "The advisory plane for hems: specialists that correlate across many exact answers, on a runtime whose journal is the plan of record — and which cannot move a household's energy, by construction"
publish     = false
version.workspace      = true
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
hems-core    = { workspace = true, features = ["serde"] }
hems-events  = { workspace = true }
hems-service = { workspace = true }

# The runtime whose journal is the plan of record. `redb` is the embedded store
# a single instance uses; `manifest` is what makes a specialist that needs a
# model a reviewable file rather than a builder call.
agentplane   = { workspace = true }

anyhow       = { workspace = true }
axum         = { workspace = true }
clap         = { version = "4", features = ["derive", "env"] }
serde        = { workspace = true }
serde_json   = { workspace = true }
time         = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
toml  = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
